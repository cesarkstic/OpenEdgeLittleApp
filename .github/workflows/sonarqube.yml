name: SonarQube (Self-Hosted Windows)

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    runs-on: [self-hosted, Windows]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Use Windows PowerShell instead of pwsh
      - name: Check SonarQube reachability
        shell: powershell
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL }}
        run: |
          if (-not $env:SONAR_HOST_URL) {
            Write-Error "SONAR_HOST_URL is empty. Set it as a repo Variable (preferred) or Secret."
            exit 1
          }
          if ($env:SONAR_HOST_URL -notmatch '^https?://') {
            Write-Error "SONAR_HOST_URL must start with http:// or https:// (got: $env:SONAR_HOST_URL)"
            exit 1
          }
          try {
            $resp = Invoke-WebRequest -Uri "$env:SONAR_HOST_URL/api/system/health" -UseBasicParsing -TimeoutSec 10
            Write-Host "SonarQube health: $($resp.Content)"
          } catch {
            Write-Warning "Could not reach $env:SONAR_HOST_URL. The scan may fail."
          }

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
