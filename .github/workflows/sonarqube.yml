name: SonarQube (Self-Hosted Windows)

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    runs-on: [self-hosted, Windows]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check SonarQube reachability (Windows PowerShell)
        shell: powershell
        env:
            SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL }}
        run: |
            if (-not $env:SONAR_HOST_URL) { Write-Error "SONAR_HOST_URL is empty"; exit 1 }

            $statusUrl = "$env:SONAR_HOST_URL/api/system/status"
            try {
            $resp = Invoke-WebRequest -Uri $statusUrl -UseBasicParsing -MaximumRedirection 0 -TimeoutSec 10 -ErrorAction Stop
            $json = $resp.Content | ConvertFrom-Json
            Write-Host "SonarQube status: $($json.status)"
            } catch {
            # Fallback: maybe redirected to HTML UI – try to read the 'data-server-status' attribute
            try {
                $root = Invoke-WebRequest -Uri $env:SONAR_HOST_URL -UseBasicParsing -TimeoutSec 10
                if ($root.Content -match 'data-server-status="([^"]+)"') {
                Write-Host "SonarQube status (from UI): $($Matches[1])"
                } else {
                Write-Warning "Reached SQ but couldn’t parse status. HTTP $($root.StatusCode)"
                }
            } catch {
                Write-Error "Could not reach $env:SONAR_HOST_URL"; exit 1
            }
            }

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN:  ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.verbose=true
            -Dsonar.branch.name=${{ github.ref_name }}

      - name: SonarQube Quality Gate
        if: ${{ github.event_name == 'push' }}
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        env:
          SONAR_TOKEN:  ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL }}
