name: SonarQube

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  analyze:
    name: SonarQube Scan
    runs-on: self-hosted
    defaults:
      run:
        shell: pwsh
    env:
      SONAR_HOST_URL: http://localhost:9000
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Sonar user cache (~/.sonar/cache)
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.USERPROFILE }}\.sonar\cache
          key: sonar-${{ runner.os }}-${{ hashFiles('**/sonar-project.properties') }}
          restore-keys: |
            sonar-${{ runner.os }}-

      - name: Download SonarScanner CLI (Windows x64)
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '7.2.0.5079'
          $zip = "$env:RUNNER_TEMP\sonar-scanner-$version-windows-x64.zip"
          $dir = "$env:RUNNER_TEMP\sonar-scanner"
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Path $dir | Out-Null
          $url = "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-$version-windows-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          $extracted = Get-ChildItem $dir | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          echo "SCANNER_DIR=$($extracted.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate environment
        run: |
          if (-not $env:SONAR_HOST_URL) { throw "SONAR_HOST_URL is empty" }
          if (-not $env:SONAR_TOKEN)    { throw "SONAR_TOKEN is empty (set repository secret SONAR_TOKEN)" }
          Write-Host "Using $env:SONAR_HOST_URL"

      - name: Run SonarQube Scanner
        run: |
          & "$env:SCANNER_DIR\bin\sonar-scanner.bat"

      - name: Show CE task URL
        if: always()
        run: |
          $taskFile = Join-Path $pwd ".scannerwork\report-task.txt"
          if (Test-Path $taskFile) {
            Get-Content $taskFile | Write-Host
          } else {
            Write-Host "report-task.txt not found"
          }
