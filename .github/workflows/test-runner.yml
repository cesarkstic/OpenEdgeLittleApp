name: Test Self-Hosted Runner

on:
  workflow_dispatch:   # lets you trigger manually from GitHub Actions tab
  push:                # also runs on push

jobs:
  test-runner:
    runs-on: self-hosted   # tells GitHub to use YOUR Windows runner
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Say hello
        run: echo "Hello from $(hostname)! The runner is working 🎉"

      - name: Show system info
        run: systeminfo | findstr /B /C:"OS Name" /C:"OS Version"
