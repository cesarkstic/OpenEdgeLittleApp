# --- Required ---
sonar.projectKey=OpenEdgeLittleApp
sonar.projectName=OpenEdgeLittleApp
sonar.sources=.

# --- OpenEdge (CABL) specifics ---
# Comma-separated propath entries; "." is repo root if your .p/.cls live there
sonar.oe.propath=.

# Optional but recommended if scanner runs on Windows host with a local DLC
# Use double backslashes or forward slashes
# sonar.oe.dlc=C:\\Progress\\OpenEdge\\oe122

# If you have a DF schema you want the analyzer to use, point to it:
# sonar.oe.databases=./schema/app.df

# If your rcode lives in a build folder, point to it (improves rules coverage):
# sonar.oe.binaries=build

# Control which file types are analyzed (defaults cover p,w,i,cls)
# sonar.oe.file.suffixes=p,w,i,cls
