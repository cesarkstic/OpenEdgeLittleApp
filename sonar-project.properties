sonar.projectKey=OpenEdgeLittleApp
sonar.sourceEncoding=windows-1252

# Source & test paths — use commas, forward slashes
sonar.sources=.,business,data,entities,datasets,exceptions
sonar.tests=test/unit
sonar.test.inclusions=**/*Test.p,**/*Test.cls,**/*Test.w

# OpenEdge: make sure includes resolve
sonar.oe.propath=.,datasets,business,data,entities,exceptions

# (optional) ignore DB artifacts, etc.
sonar.exclusions=db/**

# If you don’t have a tests folder yet, remove sonar.tests or point it to the right one
