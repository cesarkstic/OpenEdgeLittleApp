sonar.projectKey=OpenEdgeLittleApp
sonar.projectName=OpenEdgeLittleApp

# Index everything but explicitly exclude test folders from "main"
sonar.sources=.

# Your test roots (comma-separated, forward slashes)
sonar.tests=test,test/unit

# Make sure tests are NOT in sources
sonar.exclusions=**/test/**,**/tests/**

# Only treat files that look like tests as tests
sonar.test.inclusions=**/*Test.p,**/*Test.cls,**/*Test.w,**/*Test.i

# OpenEdge language globs (good to be explicit)
sonar.lang.patterns.oe=**/*.p,**/*.w,**/*.i,**/*.cls
