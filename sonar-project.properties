# sonar-project.properties
sonar.projectKey=OpenEdgeLittleApp
sonar.projectName=OpenEdgeLittleApp

# Main code ONLY (exclude test dirs)
sonar.sources=business,data,entities,exceptions,datasets

# Tests ONLY
sonar.tests=test,test/unit
# (optional) narrow by name patterns
sonar.test.inclusions=**/*Test.p,**/*Test.cls,**/*Test.w,**/*Test.i

# OpenEdge file patterns
sonar.lang.patterns.oe=**/*.p,**/*.w,**/*.i,**/*.cls
